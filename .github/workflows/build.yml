name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build
        run: gradle build --no-daemon
      - name: Inspect mixin targets (debug)
        continue-on-error: true
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged-*.jar' | head -1)
          echo "JAR $J"
          dump() { echo "== $1"; javap -p -cp "$J" "$1" | grep -E "$2" || echo "(none)"; }
          dump 'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase' 'getSoundType|canOcclude|getFaceOcclusionShape|isSolidRender'
          dump net.minecraft.world.entity.LivingEntity 'canGlide'
          dump net.minecraft.world.entity.player.Player 'tryToStartFallFlying'
          dump net.minecraft.client.player.LocalPlayer ' drop\\('
          dump net.minecraft.client.multiplayer.ClientCommonPacketListenerImpl ' send\\('
          dump net.minecraft.network.protocol.game.ServerboundPlayerCommandPacket 'getAction|START_FALL_FLYING'
          dump net.minecraft.world.item.ItemStack 'getHoverName'
          dump net.minecraft.client.renderer.entity.layers.HumanoidArmorLayer 'render|Armor'
          dump net.minecraft.client.renderer.entity.layers.WingsLayer 'render|Wings|submit'
      - uses: actions/upload-artifact@v4
        with:
          name: fakespawner-jar
          path: build/libs/*.jar
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fake Spawner (latest build)
          files: build/libs/fakespawner-*.jar
          fail_on_unmatched_files: true
