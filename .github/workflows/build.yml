name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build
        run: gradle build --no-daemon
      - name: Inspect mixin targets (debug)
        continue-on-error: true
        run: |
          for j in $(find ~/.gradle -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/player/LocalPlayer.class'; then
              echo "== $j"
              javap -p -cp "$j" net.minecraft.client.player.LocalPlayer | grep -E " drop\(" || true
              javap -p -cp "$j" 'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase' | grep -E "getSoundType|canOcclude" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fakespawner-jar
          path: build/libs/*.jar
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fake Spawner (latest build)
          files: build/libs/fakespawner-*.jar
          fail_on_unmatched_files: true
